# The VM TLS proxy overwrites this header; production HTTP_BIND should be loopback.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

log_format safe_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent request_id=$upstream_http_x_request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout safe_access;
    error_log /dev/stderr warn;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
