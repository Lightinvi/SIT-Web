services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    expose:
      - "8000"
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
