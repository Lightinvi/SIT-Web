services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the VM .env}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/users', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/users"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
