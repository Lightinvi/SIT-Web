services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the VM .env}
      DISCORD_BOT_CLIENT_ID: ${DISCORD_BOT_CLIENT_ID:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      STORAGE_PATH: /app/storage
      LOG_DIRECTORY: /app/logs
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    volumes:
      - storage:/app/storage
      - logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 1h
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 5s

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 1h
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 5s

volumes:
  storage:
  logs:
